services:
  - type: web
    name: karaoke
    env: node
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: karaoke-db
          property: connectionString
      - key: ADMIN_PIN
        sync: false
      - key: NODE_ENV
        value: production

databases:
  # No plan on purpose: Render keeps an existing database on its current (paid) plan.
  # "plan: free" here could downgrade it if the Blueprint were ever re-synced.
  - name: karaoke-db
    databaseName: karaoke
